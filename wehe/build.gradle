plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'jacoco'
}
android {

    defaultConfig {
        applicationId "mobi.meddle.wehe"
        compileSdk 36
        minSdkVersion 24
        targetSdkVersion 36
//        multiDexEnabled true
        versionCode 59
        versionName "3.9.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
            // Only wired up when the CI env vars are present; local `assembleRelease`
            // without them falls back to Android's default unsigned release build.
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("RELEASE_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }
    productFlavors {
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'mobi.meddle.wehe'
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
//        nonTransitiveRClass = true
        compose true
        // Replaces the deprecated android.defaults.buildfeatures.buildconfig gradle property.
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.7'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // androidx.datastore ships this prebuilt without the sections the NDK strip tool
            // expects, so AGP cannot strip it. Keep its symbols explicitly instead of having
            // every build warn that stripping failed.
            keepDebugSymbols += '**/libdatastore_shared_counter.so'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            // Gradle defaults a Test task to 512m. Robolectric loads a full instrumented Android
            // runtime per SDK sandbox, which does not comfortably fit; CI runners hit this before
            // developer machines do because they have less headroom to absorb it.
            all {
                maxHeapSize = "2048m"
            }
        }
    }
}


dependencies {
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.compose.foundation:foundation-android:1.5.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
    implementation 'androidx.hilt:hilt-common:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    def activity_version = "1.8.2"
    def nav_version = "2.8.5"
    // Java language implementation
    implementation "androidx.activity:activity:$activity_version"
    // dependency injection
    implementation 'com.google.dagger:hilt-android:2.51'
    kapt 'com.google.dagger:hilt-compiler:2.51'
    // Hilt WorkManager integration
    implementation "androidx.hilt:hilt-work:1.0.0"
    kapt "androidx.hilt:hilt-compiler:1.0.0"
    // Kotlin
    implementation "androidx.activity:activity-ktx:$activity_version"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.glassfish.tyrus.bundles:tyrus-standalone-client:1.17' //for WebSocket
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation "androidx.datastore:datastore-preferences:1.1.3"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // For Local unit tests
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.google.truth:truth:1.1.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.1'
    testImplementation 'org.mockito:mockito-android:4.5.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-inline:5.1.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Lets ReplayWorkerTest stand up an in-memory WorkManager. The app removes WorkManager's
    // default initializer from the manifest (it supplies its own Hilt worker factory), so
    // WorkManager.getInstance() is not usable in tests without this.
    testImplementation 'androidx.work:work-testing:2.10.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.7'

    // Instrumentation tests
    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1')
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    // MainActivityTest drives the runtime permission dialog through UiDevice.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation('androidx.test:rules:1.6.1')
    androidTestImplementation composeBom
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.44'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'com.google.truth:truth:1.1.3'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.9.1'
    androidTestImplementation 'org.mockito:mockito-android:4.5.1'

    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Retrofit (core library)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // Moshi Converter (for JSON parsing)
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'

    // Logging Interceptor (for debugging network requests)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Coroutines Support for Retrofit (if using Kotlin Coroutines)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}
kapt {
    correctErrorTypes true
}

jacoco {
    toolVersion = "0.8.11"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', 'android/**/*.*', '**/*_Factory.*', '**/*_MembersInjector.*',
            '**/Hilt_*.*', '**/*_HiltModules*.*', '**/*Dagger*.*', '**/*_Provide*Factory.*',
            '**/databinding/**', '**/generated/**'
    ]
    // Both Kotlin and Java classes end up merged here after Hilt's ASM transform runs;
    // that's the bytecode actually loaded at test time, so it's what must be analyzed
    // (the pre-transform tmp/kotlin-classes/debug output has mismatching class IDs
    // and silently reports 0% coverage for every Kotlin class).
    def classesTree = fileTree(dir: "${project.layout.buildDirectory.get()}/intermediates/classes/debug/transformDebugClassesWithAsm/dirs", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([classesTree]))
    executionData.setFrom(fileTree(dir: project.layout.buildDirectory.get(), includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
    ]))
}